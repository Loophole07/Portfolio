<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TypeScript Form</title>
  <style>
    span { color: red; }
  </style>
</head>
<body>
  <form id="myForm">
    <input type="text" id="name" placeholder="Enter name" />
    <span id="nameError"></span><br/>

    <input type="number" id="age" placeholder="Enter age" />
    <span id="ageError"></span><br/>

    <button type="submit">Submit</button>
  </form>

  <div id="output"></div>

  <script src="form_script.js"></script> <!-- compiled JS file -->
</body>
</html>
