<form name="checking">
Enter one number : <input type="number" name="one">
<br>
Enter second number : <input type="number" name="two">
<br>
<input type="submit" value="submit" onclick="check()">
</form>
<script>
    function check(){
        var x = parseInt(document.checking.one.value);
        var y = parseInt(document.checking.two.value);
        var z = x+y;
        if (x === 50 || y === 50 || z === 50) {
                document.write("True");
            } else {
                document.write("False");
            }

    }
</script>
