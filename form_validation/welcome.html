<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome</title>

  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .welcome-box {
      background-color: #ffffff;
      padding: 40px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #4a90e2;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      padding: 10px 20px;
      background-color: #4a90e2;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-size: 14px;
    }

    a:hover {
      background-color: #357abd;
    }
  </style>
</head>
<body>

  <div class="welcome-box">
    <h1>Welcome </h1>
    <p>Your registration was successful.</p>
    <a href="form.html">Go Back</a>
  </div>

</body>
</html>
